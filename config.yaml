# FaultTwin configuration.
# SI units throughout; the unit is part of each key name. Angular frequencies are in rad/s.

plant:
  v_dc_V: 400.0
  r_ohm: 5.0                  # per phase
  l_H: 0.010                  # per phase
  w1_rad_s: 314.1592653589793 # 2*pi*50
  m: 0.8                      # modulation index
  f_sw_Hz: 10000.0            # nominal switching frequency; documented only, the averaged model does not switch
  dt_s: 2.0e-5                # 1000 samples per fundamental period
  eps_open_leg_A: 0.05        # zero-current band for a fully open leg
  noise_sigma_frac: 0.005     # measurement noise sigma as a fraction of rated peak current
  param_mismatch_frac: 0.05   # per-session R and L drawn within +/- this fraction of nominal
  dead_time_enabled: false
  dead_time_s: 1.0e-6
  # Device voltage drops in the plant. The values are filled from the verified module
  # datasheet in Phase 3 (never invented); the twin only learns them from the Tavily lookup.
  device_drops_enabled: false
  v_ce_sat_V: null
  v_f_V: null

features:
  window_cycles: 2

monitor:
  # Calibrate on seeds that are separate from the evaluation seeds.
  mu_abs_max: 0.10
  mu_consecutive_cycles: 2
  r_kcl_dc_max: 0.03
  r_kcl_w1_max: 0.05
  amp_ratio_band: [0.90, 1.10]
  low_rms_frac: 0.05          # one phase RMS below this fraction of the others
  i_s_step_frac: 0.20         # cycle-to-cycle change in |i_s| treated as a transient
  warmup_cycles: 5            # no checks while the plant starts up from zero current
  min_i_s_A: 1.0              # below this |i_s| the plant counts as stopped (noise alone gives ~0.14 A)
  clear_ratio: 0.8            # a latched check clears only below clear_ratio x its threshold ...
  clear_cycles: 3             # ... for this many consecutive cycles (hysteresis against chatter)

twin:
  settle_cycles: 4            # twin starts from zero current this many cycles before the window
  fit_grid_points: 23         # coarse grid for the 1-D look-alike fits ...
  fit_tolerance: 0.002        # ... then golden-section until the bracket is this narrow
  # A look-alike whose fitted size is below its minimum effect only soaks up the plant's normal
  # tolerance (+/-5 % R and L) and cannot be told apart from a healthy plant: it is flagged and
  # penalised. The penalty is full below min_effect and falls linearly to zero at
  # (1 + tolerance_ramp_frac) x min_effect, so there is no cliff at the band edge.
  # Largest fitted sizes on healthy plants: 0.062 R factor, 0.021 load step, 0.019 gain, 0.009 A
  # offset on the 10 calibration seeds; 0.103, 0.049, 0.031, 0.013 A over 3000 review-sweep runs
  # (seeds 5000-5999). The gain band and the ramp were chosen by replaying those sweeps:
  # healthy 3000/3000, single-phase unbalance 0.7-1.3 676/1000, converter fault or not 4000/4000.
  min_effect:
    sensor_offset: 0.2        # A
    sensor_gain: 0.05
    load_unbalance: 0.10
    load_step: 0.10
  within_tolerance_penalty_pct: 3.0
  tolerance_ramp_frac: 0.25
  # The twin compares against steady state: the cycles in a window must agree, or the window
  # still holds a fault onset or the transient after an m change.
  max_cycle_i_s_change: 0.02  # relative change of per-cycle |i_s| inside the window
  max_cycle_mu_change: 0.02   # change of per-cycle mu inside the window
  min_i_s_A: 1.0              # below this the plant is stopped or carries no current
  max_cache_entries: 256

# Seeds for calibrating the monitor thresholds and the twin's min_effect band.
calibration_seeds: [9001, 9002, 9003, 9004, 9005, 9006, 9007, 9008, 9009, 9010]
# Other reserved seeds. The evaluation (Phase 5) must use none of these:
#   7001-7003  pytest acceptance tests of the twin
#   5000-5999  adversarial review sweeps

llm:
  # Global URL from the Token Factory docs; answered the Phase 0 smoke test on 2026-10-21.
  # The docs warn that regional URLs can stop working when a public endpoint moves region.
  base_url: "https://api.tokenfactory.nebius.com/v1/"
  base_url_alternatives:
    - "https://api.tokenfactory.us-central1.nebius.com/v1/"
  timeout_s: 60
  max_retries: 4
  # Resolved from client.models.list() by scripts/smoke_test_nebius.py. Letter case matters.
  models_verified_on: "2026-10-21"
  models:
    triage: "nvidia/Nemotron-3_5-Lightning"         # Nemotron 3.5 Lightning (underscore in the ID)
    triage_fallback: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
    agent: "nvidia/nemotron-3-super-120b-a12b"
    report: "nvidia/Nemotron-3-Ultra-550b-a55b"
    report_fallback: "nvidia/nemotron-3-super-120b-a12b"
  # Work order. Measured 2026-10-21 (scripts/measure_report_latency.py): Ultra streamed with reasoning
  # off and max_tokens 800 finished in 1.4-2.1 s, but the same model took 90-120 s earlier that day.
  # So Ultra writes the work order live, and the fallback model starts at the same time as a hedge.
  # If Ultra misses a deadline, the fallback's work order is shown at once, and Ultra's text is shown
  # later as a "senior review" when it arrives. The UI never waits for Ultra past the deadlines.
  # Replays and the evaluation wait for Ultra's full output.
  report:
    stream: true
    enable_thinking: false
    max_tokens: 1000
    hedge_with_fallback: true
    first_token_deadline_s: 10
    total_deadline_s: 30
  # Reasoning is on by default for every Nemotron model. This switches it off
  # (verified on Lightning, Nano and Super; a "/no_think" system prompt does not work).
  no_thinking_extra_body: {chat_template_kwargs: {enable_thinking: false}}
  # Model-card sampling recommendations (temperature, top_p).
  sampling:
    lightning: [1.0, 0.95]
    nano: [0.6, 0.95]        # tool-calling setting from the Nano card
    super: [1.0, 0.95]
    ultra: [1.0, 0.95]
  # USD per 1M tokens, [input, output]. Public Token Factory model catalog, checked 2026-10-21.
  prices_usd_per_1m_tokens:
    nano: [0.06, 0.24]
    lightning: [0.06, 0.24]
    super: [0.30, 0.90]
    ultra: [1.00, 3.00]

agent:
  max_tool_calls: 10
  max_wall_s: 90
  max_cost_usd: 0.10
  json_repair_retries: 2
  thinking: "low"             # Super reasons briefly (low_effort); "off" or "default" also allowed
  max_tokens_per_turn: 2048
  top_n_ranked: 6             # causes shown to the model per simulate_hypotheses call
  steady_wait_cycles: 8       # most cycles a tool advances the plant to get a steady window
  record_cycles: 300          # plant cycles kept for the trace and replays (the plant runs about 2.5 cycles/s in the app)

interlock:
  # The language model proposes; this code decides. All limits are checked on every request.
  m_min: 0.3
  m_max: 0.9
  min_test_step: 0.15         # smallest informative modulation step for the active test
  min_test_cycles: 3
  max_test_cycles: 10
  derate_current_frac: 0.5    # derate so the predicted peak current is <= this x I_C,nom (datasheet)
  default_derate_m: 0.4       # when I_C,nom is not verified ("needs datasheet")
  test_current_frac: 0.8      # an active test may not drive the predicted peak above this x I_C,nom
  test_current_fallback_A: 32.5   # ... or above this when I_C,nom is unknown (1.2 x rated peak)
  confirm_max_error_pct: 15.0 # a converter fault counts as confirmed only if it is the twin's best match,
  confirm_margin_pct: 5.0     # within this error, and this many points ahead of every non-fault cause
  plausible_margin_pct: 10.0  # causes within this many points of the best count as plausible for safety checks
  model_margin_frac: 0.05     # predicted currents are divided by (1 - this) for the plant's +/-5 % tolerance

budget:
  live_runs_per_session: 3
  daily_usd: 1.0              # overridden by DEMO_DAILY_BUDGET_USD
  total_usd: 15.0             # overridden by DEMO_TOTAL_BUDGET_USD
  # Rashed's Tavily account has 1,000 credits for everything; a live diagnosis uses 1-3.
  tavily_daily_credits: 25    # overridden by DEMO_TAVILY_DAILY_CREDITS
  tavily_total_credits: 400   # overridden by DEMO_TAVILY_TOTAL_CREDITS
  ledger_path: "data/cache/spend.json"

tavily:
  search_depth: "basic"
  max_results: 5
  # Basic extract can fail on a PDF that advanced extract reads (seen on 2026-10-21),
  # and distributor PDFs may return an anti-bot page; retry those at "advanced".
  extract_depth: "basic"
  extract_retry_depth: "advanced"
  cache_dir: "data/cache/tavily"
  # Verified datasheet facts read through Tavily on 2026-10-21, committed and used instead of a live
  # extraction while present (scripts/verify_nameplate.py repeats the live read); shown as "via Tavily
  # (cached 2026-10-21)".
  seed_datasheets_dir: "data/seed/datasheets"

nameplate:
  # Verified through Tavily with scripts/verify_nameplate.py on 2026-10-21.
  inverter_rating: "Two-level three-phase inverter, 400 V DC link, 27 A peak phase current"
  igbt_module_part_number: "A1P50S65M2"
  igbt_module_datasheet_url: "https://www.st.com/resource/en/datasheet/a1p50s65m2.pdf"
  gate_driver_part_number: "STGAP2S"
  gate_driver_datasheet_url: "https://www.st.com/resource/en/datasheet/stgap2s.pdf"
  verified_on: "2026-10-21"
